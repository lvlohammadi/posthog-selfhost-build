name: Mirror image to ghcr.io

# Manual runs only. Copies one image from another registry to the GitHub Container Registry,
# registry to registry, so no layer is downloaded to a machine. The image manifests stay the same.
# A host that cannot reach the source registry pulls from ghcr.io instead.
on:
    workflow_dispatch:
        inputs:
            source:
                description: Full source image, for example docker.io/<user>/posthog-selfhost:sync-20261112-e1437dd6533 or quay.io/coreos/etcd:v3.6.8
                required: true
            target_name:
                description: Package name under ghcr.io/<owner>/, for example posthog-selfhost-mirror or mirror-etcd
                required: true
            target_tag:
                description: Tag in the target package
                required: true

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: read
    packages: write

jobs:
    mirror:
        name: Copy to ghcr.io
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Copy the image
              env:
                  SOURCE: ${{ inputs.source }}
                  TARGET_NAME: ${{ inputs.target_name }}
                  TARGET_TAG: ${{ inputs.target_tag }}
                  OWNER: ${{ github.repository_owner }}
                  REPO: ${{ github.repository }}
              run: |
                  target="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$TARGET_NAME:$TARGET_TAG"
                  echo "TARGET=$target" >> "$GITHUB_ENV"
                  # The source label links a new package to this repository, so the workflow token may create it.
                  docker buildx imagetools create \
                      --annotation "index:org.opencontainers.image.source=https://github.com/$REPO" \
                      --tag "$target" "$SOURCE"

            - name: Check that the image manifests are unchanged
              env:
                  SOURCE: ${{ inputs.source }}
              run: |
                  list() {
                      docker buildx imagetools inspect "$1" --raw | jq -r 'if .manifests then .manifests[].digest else empty end' | sort
                  }
                  source_manifests="$(list "$SOURCE")"
                  target_manifests="$(list "$TARGET")"
                  echo "source manifests:"; echo "$source_manifests"
                  echo "target manifests:"; echo "$target_manifests"
                  [ -n "$source_manifests" ] && [ "$source_manifests" = "$target_manifests" ]
                  echo "### Copied \`$SOURCE\` to \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"
