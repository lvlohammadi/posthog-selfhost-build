name: Mirror image to ghcr.io

# Manual runs only. Copies one tag of the self-hosted image from Docker Hub to the GitHub
# Container Registry, registry to registry, so no layer is downloaded to a machine.
# The digest stays the same. A host that cannot reach Docker Hub's download hosts pulls from ghcr.io.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Tag of the Docker Hub image to copy, for example sync-20261112-e1437dd6533
                required: true

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: read
    packages: write

env:
    SOURCE_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/posthog-selfhost
    TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/posthog-selfhost

jobs:
    mirror:
        name: Copy to ghcr.io
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Copy the tag
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  target="$(echo "$TARGET_IMAGE" | tr '[:upper:]' '[:lower:]')"
                  docker buildx imagetools create --tag "$target:$TAG" "$SOURCE_IMAGE:$TAG"

            - name: Check that the digest is unchanged
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  target="$(echo "$TARGET_IMAGE" | tr '[:upper:]' '[:lower:]')"
                  source_digest="$(docker buildx imagetools inspect "$SOURCE_IMAGE:$TAG" --format '{{json .Manifest.Digest}}')"
                  target_digest="$(docker buildx imagetools inspect "$target:$TAG" --format '{{json .Manifest.Digest}}')"
                  echo "docker hub: $source_digest"
                  echo "ghcr.io:    $target_digest"
                  [ "$source_digest" = "$target_digest" ]
                  echo "### Copied \`$target:$TAG\` ($target_digest)" >> "$GITHUB_STEP_SUMMARY"
